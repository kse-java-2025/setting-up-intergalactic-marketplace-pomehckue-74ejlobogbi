openapi: 3.0.0
info:
  title: Cosmo Cats API
  description: API for selling space goods such as anti-gravity yarn balls and cosmic milk
  version: 1.0.0

paths:
  /api/v1/products:
    get:
      summary: Get all products
      description: Retrieves a list of all available products in the marketplace
      tags:
        - Products
      responses:
        '200':
          description: List of all products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductDto'

    post:
      summary: Create a new product
      description: Creates a new product in the marketplace
      tags:
        - Products
      requestBody:
        description: Product data to create
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductDto'
      responses:
        '200':
          description: Product successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDto'
        '400':
          description: Invalid input - validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /api/v1/products/{id}:
    parameters:
      - in: path
        name: id
        required: true
        description: UUID of the product
        schema:
          type: string
          format: uuid

    get:
      summary: Get product by ID
      description: Retrieves a single product by its unique identifier
      tags:
        - Products
      responses:
        '200':
          description: Product found and returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDto'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Update product by ID
      description: Updates an existing product with new data
      tags:
        - Products
      requestBody:
        description: Updated product data
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductDto'
      responses:
        '200':
          description: Product successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDto'
        '400':
          description: Invalid input - validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Delete product by ID
      description: Deletes a product from the marketplace
      tags:
        - Products
      responses:
        '204':
          description: Product successfully deleted
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    ProductDto:
      type: object
      required:
        - name
        - price
        - stock
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the product (auto-generated)
          readOnly: true
        name:
          type: string
          maxLength: 100
          description: Name of the product (must include cosmic terms (e.g., "star", "galaxy", "comet"))
        description:
          type: string
          maxLength: 2000
          description: Detailed description of the product
        price:
          type: number
          format: double
          minimum: 0.01
          description: Product price (must be at least 0.01)
        stock:
          type: integer
          minimum: 0
          description: Available inventory count (cannot be negative)
        categoryId:
          type: string
          format: uuid
          description: UUID of the category this product belongs to
          nullable: true

    ValidationError:
      type: object
      properties:
        status:
          type: integer
          description: HTTP status code
        error:
          type: string
          description: Error type
          example: "Bad Request"
        message:
          type: string
          description: Detailed validation error message
        path:
          type: string
          description: Request path where error occurred
          example: "/api/v1/products"

    ErrorResponse:
      type: object
      description: Problem Details for HTTP APIs
      properties:
        type:
          type: string
          format: uri
          description: URI reference identifying the error type
          example: "product-not-found"
        title:
          type: string
          description: A short description of the error
          example: "Product Not Found"
        status:
          type: integer
          description: HTTP status code
        detail:
          type: string
          description: Detailed description of the error

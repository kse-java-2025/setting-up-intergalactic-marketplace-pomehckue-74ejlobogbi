openapi: 3.0.0
info:
  title: Cosmo Cats API
  description: API for selling space goods such as anti-gravity yarn balls and cosmic milk
  version: 1.0.0

paths:
  /api/v1/products:
    get:
      summary: Get all products
      tags:
        - Products
      responses:
        '200':
          description: List of all products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListDto'
    post:
      summary: Create a new product
      tags:
        - Products
      requestBody:
        description: Product payload to create
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductDto'
      responses:
        '200':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /api/v1/products/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
        description: ID of the product to retrieve
    get:
      summary: Get product by ID
      tags:
        - Products
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update product by id
      tags:
        - Products
      requestBody:
        description: Product payload to update
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductDto'
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
    delete:
      summary: Delete product by id
      tags:
        - Products
      responses:
        '204':
          description: Product deleted
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    Product:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier of the product
        name:
          type: string
          maxLength: 100
          description: Name of the product (must include cosmic terms (e.g., "star", "galaxy", "comet"))
        description:
          type: string
          maxLength: 2000
          description: Detailed description of the product
        price:
          type: number
          format: double
          minimum: 0.01
          description: Product price
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: Currency code (e.g. USD)
        stock:
          type: integer
          minimum: 0
          description: Inventory count

    ProductDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          description: Name of the product (must include cosmic terms (e.g., "star", "galaxy", "comet"))
        description:
          type: string
          maxLength: 2000
          description: Detailed description of the product
        price:
          type: number
          format: double
          minimum: 0.01
          description: Product price
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: Currency code (e.g. USD)
        stock:
          type: integer
          minimum: 0
          description: Inventory count

    ProductListDto:
      type: object
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/ProductDto'

    ValidationError:
      type: object
      properties:
        status:
          type: string
          example: "400"
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ParamsViolationDetails'

    ErrorResponse:
      type: object
      properties:
        type:
          type: string
          description: URI reference identifying the error type
        title:
          type: string
          description: A short description of the error
        status:
          type: integer
          description: HTTP status code
        detail:
          type: string
          description: Detailed description of the error

    ParamsViolationDetails:
      type: object
      properties:
        fieldName:
          type: string
          description: Field where validation error occurred
        reason:
          type: string
          description: Reason for the validation error